
name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'infra/**'
      - 'refactor/**'
      - 'hotfix/**'
      - 'fix/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_DATABASE: ecommerce_test
      DB_USERNAME: ecommerce
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PostgreSQL volume
        run: docker volume create Ecom_postgres_data

      - name: Build backend image
        run: docker compose -f compose.yaml -f compose.dev.yaml build backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecom-backend:dev
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Create CI environment file
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' backend/.env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' backend/.env
          sed -i 's/^DB_HOST=.*/DB_HOST=database/' backend/.env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' backend/.env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=ecommerce_test/' backend/.env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=ecommerce/' backend/.env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_password/' backend/.env

      - name: Start database, Redis and backend
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d database redis backend

      - name: Wait for PostgreSQL
        run: |
          until docker compose -f compose.yaml -f compose.dev.yaml exec -T database pg_isready -U ecommerce -d ecommerce_test; do
            sleep 2
          done

      - name: Install Composer dependencies
        run: docker compose -f compose.yaml -f compose.dev.yaml exec -T backend composer install --no-interaction --prefer-dist --no-progress --no-security-blocking

      - name: Generate application key
        run: docker compose -f compose.yaml -f compose.dev.yaml exec -T backend php artisan key:generate --force

      - name: Run migrations
        run: docker compose -f compose.yaml -f compose.dev.yaml exec -T backend php artisan migrate --force

      - name: Run tests
        run: docker compose -f compose.yaml -f compose.dev.yaml exec -T backend php artisan test
