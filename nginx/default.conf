
server {
    listen 80;
    server_name chateaudulac-belgium.com www.chateaudulac-belgium.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chateaudulac-belgium.com www.chateaudulac-belgium.com;

    ssl_certificate /etc/letsencrypt/live/chateaudulac-belgium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chateaudulac-belgium.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
    }

    location /api {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }
}
