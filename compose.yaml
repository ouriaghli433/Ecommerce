services:

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile

    image: ecommerce-backend:dev

    container_name: ecommerce-backend

    working_dir: /var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  # Runs the queued jobs: notifications and order expiration.
  # Without it the jobs simply wait in the "jobs" table.
  worker:
    image: ecommerce-backend:dev

    container_name: ecommerce-worker

    working_dir: /var/www/html

    command: php artisan queue:work --tries=3 --sleep=1 --max-time=3600

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce

    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

    depends_on:
      - backend
      - database

    restart: unless-stopped

  # The clock: queues the expiration of unpaid orders every minute and
  # cleans old idempotency keys every day.
  scheduler:
    image: ecommerce-backend:dev

    container_name: ecommerce-scheduler

    working_dir: /var/www/html

    command: php artisan schedule:work

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce

    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

    depends_on:
      - backend
      - database

    restart: unless-stopped

  database:
    image: postgres:15-alpine

    container_name: ecommerce-database

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro

  nginx:
    image: nginx:alpine

    container_name: ecommerce-nginx

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ecommerce-frontend:dev

    container_name: ecommerce-frontend

    ports:
      - "5173:5173"

    environment:
      # The browser (not the container) calls this URL, so it is localhost.
      VITE_API_URL: http://localhost:8080/api
      VITE_APP_NAME: Verdant

    volumes:
      # The code, so Vite reloads on every change...
      - ./frontend:/app
      # ...but node_modules stays inside Docker (much faster, and it keeps
      # the Linux packages separate from the host).
      - frontend_node_modules:/app/node_modules

    depends_on:
      - nginx

  redis:
    image: redis:7-alpine

    container_name: ecommerce-redis

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules: