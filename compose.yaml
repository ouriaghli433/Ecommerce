services:

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile

    image: ecommerce-backend:dev

    container_name: ecommerce-backend

    working_dir: /var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  database:
    image: postgres:15-alpine

    container_name: ecommerce-database

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine

    container_name: ecommerce-nginx

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

  redis:
    image: redis:7-alpine

    container_name: ecommerce-redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecommerce-frontend:dev
    container_name: ecommerce-frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  queue:
    image: ecommerce-backend:dev
    container_name: ecommerce-queue
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - database
      - redis

  worker:
    image: ecommerce-backend:dev
    container_name: ecommerce-worker
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped
    depends_on:
      - database
      - redis

  scheduler:
    image: ecommerce-backend:dev
    container_name: ecommerce-scheduler
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped
    depends_on:
      - database
      - redis
volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules: