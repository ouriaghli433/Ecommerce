services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecom-backend:latest
    working_dir: /var/www/html
    container_name: Ecom-backend
    depends_on:
      - database
      - redis

  database:
    image: postgres:15-alpine
    container_name: Ecom-database
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - Ecom_postgres_data:/var/lib/postgresql/data #default path where postgres store data
    
  redis:
    image: redis:7-alpine
    container_name: Ecom-redis

  worker:
    image: ecom-backend:latest
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis" ,"--tries=3","--sleep=3","--timeout=90"]
    depends_on:
      - database
      - redis

  scheduler:
    image: ecom-backend:latest
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - backend
      - redis
  
volumes:
  Ecom_postgres_data:
    external: true